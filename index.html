<title>Wildwood — A life in the frontier</title>
<style>

idth:36px;height:36px;border-radius:50%;background:#c9d4bc;display:grid;place-items:center;font-size:18px}.content{max-width:1500px;margin:auto;padding:28px 34px 40px}.welcome{display:flex;align-items:end;justify-content:space-between;margin-bottom:21px}.welcome h1{font:500 30px/1.15 Georgia,serif;margin:4px 0 0;letter-spacing:-.4px}.welcome p{color:#7d897f;margin:6px 0 0;font-size:13px}.day-pill{font-size:11px;color:#778477;background:#eeeee3;padding:8px 12px;border-radius:20px}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,.78fr);gap:20px;align-items:stretch}.scene{height:410px;border-radius:18px;position:relative;overflow:hidden;background:#7d9b78;box-shadow:var(--shadow);isolation:isolate}.scene-art{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#c1d5c1 0%,#d1d7b4 35%,#9fb58a 36%,#829c70 100%)}.sun{position:absolute;width:72px;height:72px;background:#f6dfa0;border-radius:50%;right:19%;top:12%;box-shadow:0 0 45px #f4e0a37c}.cloud{position:absolute;background:#eef0d5aa;height:14px;width:75px;border-radius:50%;top:16%;left:23%;filter:blur(4px)}.cloud.c2{top:26%;left:57%;width:112px}.mountain{position:absolute;bottom:40%;width:0;height:0;border-left:190px solid transparent;border-right:200px solid transparent;border-bottom:180px solid #829d8b;filter:drop-shadow(12px 0 0 #91a792)}.mountain.m1{left:10%;transform:scale(.8)}.mountain.m2{right:7%;bottom:42%;transform:scale(.9);border-bottom-color:#91a995}.ridge{position:absolute;bottom:24%;left:-4%;width:110%;height:44%;border-radius:48% 52% 0 0;background:#849d73;transform:rotate(-4deg)}.ridge.r2{bottom:12%;height:36%;background:#718d66;transform:rotate(5deg);left:-9%}.meadow{position:absolute;bottom:-4%;left:-4%;width:110%;height:35%;background:#66865e;transform:rotate(-2deg);border-radius:50% 50% 0 0}.path{position:absolute;bottom:-20%;left:43%;width:22%;height:65%;background:#bea878;transform:rotate(13deg);clip-path:polygon(35% 0,68% 0,100% 100%,0 100%);opacity:.85}.tree{position:absolute;bottom:21%;width:68px;height:150px;z-index:2}.tree:before{content:"";position:absolute;bottom:0;left:31px;width:10px;height:72px;background:#604f39;border-radius:5px}.tree:after{content:"";position:absolute;bottom:44px;left:-2px;width:74px;height:98px;background:#4f7356;clip-path:polygon(50% 0,100% 57%,76% 57%,100% 100%,0 100%,24% 57%,0 57%);filter:drop-shadow(4px 5px 0 #335b44)}.tree.t1{left:8%;transform:scale(.9)}.tree.t2{left:25%;transform:scale(.63);bottom:18%}.tree.t3{right:7%;transform:scale(1.13)}.tree.t4{right:27%;transform:scale(.55);bottom:16%}.flower{position:absolute;bottom:17%;font-size:22px;z-index:4}.f1{left:31%}.f2{right:34%;font-size:17px}.f3{left:15%;bottom:12%;font-size:16px}.deer{position:absolute;left:53%;bottom:26%;z-index:3;font-size:42px;filter:drop-shadow(2px 6px 2px #29442f44);transform:scaleX(-1)}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#17271b68 0%,transparent 60%),linear-gradient(0deg,#17271b3c,transparent 38%);pointer-events:none}.scene-copy{position:absolute;z-index:5;left:28px;bottom:26px;color:#fff}.scene-copy .eyebrow{color:#d8dfc9}.scene-copy h2{font:500 29px Georgia,serif;margin:4px 0}.scene-copy p{color:#e0e5d6;margin:0;font-size:12px}.region-badge{position:absolute;top:17px;left:19px;z-index:5;background:#f8f6e8df;color:#536c54;border-radius:20px;padding:7px 11px;font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}.scene-controls{position:absolute;right:18px;bottom:18px;z-index:5;display:flex;gap:9px}.scene-ctl{border:1px solid #ffffff72;background:#ffffff25;color:#fff;border-radius:12px;padding:8px 11px;font-size:11px;backdrop-filter:blur(8px)}.sidecol{display:flex;flex-direction:column;gap:14px}.card{background:var(--panel);border:1px solid #e8e6dc;border-radius:16px;padding:17px 18px;box-shadow:0 5px 20px #182b1e08}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.card-title{font:600 16px Georgia,serif}.subtle{font-size:11px;color:#899287}.quest{background:#f3f1e7;border-radius:12px;padding:12px;margin-bottom:10px}.quest-top{display:flex;justify-content:space-between;align-items:center}.quest-name{font-weight:700;font-size:12px}.quest-xp{color:#a67d43;font-size:10px;font-weight:700}.quest-desc{color:#7b867d;font-size:11px;margin:6px 0 9px}.progress{height:5px;background:#e1e2d6;border-radius:4px;overflow:hidden}.progress i{height:100%;display:block;background:#7c9a70;border-radius:4px;transition:width .3s}.quest-count{font-size:10px;color:#7a877a;display:flex;justify-content:space-between;margin-top:5px}.companion{display:flex;align-items:center;gap:12px}.companion-icon{width:47px;height:47px;background:#f0e5cd;border-radius:14px;display:grid;place-items:center;font-size:25px}.companion-meta{flex:1}.companion-meta b{display:block;font:600 14px Georgia,serif}.companion-meta span{font-size:10px;color:#8a9387}.mood{color:#6b906b;font-size:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.action-btn{border:1px solid #e6e5d9;background:#faf9f2;border-radius:11px;padding:10px 8px;color:#59685b;font-size:11px;font-weight:700;transition:.18s}.action-btn span{display:block;font-size:17px;margin-bottom:3px}.action-btn:hover{border-color:#90a78d;background:#f1f5eb;transform:translateY(-1px)}.action-btn.primary{background:#5e7d5e;color:#fff;border-color:#5e7d5e}.action-btn.primary:hover{background:#496a50}.section-row{display:flex;justify-content:space-between;align-items:end;margin:25px 0 12px}.section-row h2{font:500 20px Georgia,serif;margin:0}.section-row p{margin:4px 0 0;color:#849087;font-size:11px}.text-btn{border:0;background:none;color:#718a6a;font-weight:700;font-size:11px}.resource-row{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.resource{border:1px solid #e8e6dc;background:#fbfaf4;padding:12px 13px;border-radius:13px;display:flex;align-items:center;gap:11px;min-width:0}.resource-icon{width:37px;height:37px;border-radius:11px;background:#efeee3;display:grid;place-items:center;font-size:19px;flex-shrink:0}.resource-info{min-width:0}.resource-name{font-size:11px;color:#7f8a80}.resource-amount{font-weight:800;font-size:16px;margin-top:1px}.lower-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.8fr);gap:18px;margin-top:21px}.craft-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.recipe{border:1px solid #e8e6dc;background:#fbfaf4;border-radius:13px;padding:12px;display:flex;align-items:center;gap:10px}.recipe-icon{font-size:22px;width:38px;height:38px;border-radius:11px;background:#f1eee1;display:grid;place-items:center}.recipe-info{flex:1;min-width:0}.recipe-info b{font-size:11px;display:block}.recipe-info span{font-size:9px;color:#858e83;display:block;margin-top:3px}.make-btn{border:0;background:#e9eee4;color:#607b60;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:800}.make-btn:disabled{opacity:.42;cursor:not-allowed}.log{height:127px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:3px}.log-line{font-size:11px;color:#778379;display:flex;gap:8px;align-items:flex-start}.log-line time{font-size:9px;color:#a1a99e;white-space:nowrap;margin-top:2px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#18271f;color:#f4f2e9;border-radius:12px;padding:11px 16px;box-shadow:0 12px 35px #0003;font-size:12px;opacity:0;transition:.25s;pointer-events:none;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-back{position:fixed;inset:0;background:#16231b66;z-index:15;display:none;place-items:center;padding:18px}.modal-back.open{display:grid}.modal{width:min(560px,100%);background:#fbfaf4;border-radius:19px;padding:22px;box-shadow:0 20px 70px #0003}.modal-top{display:flex;justify-content:space-between;align-items:center}.modal h2{font:500 23px Georgia,serif;margin:0}.close{border:0;background:#eeede4;border-radius:9px;width:32px;height:32px;font-size:18px}.map-nodes{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}.map-node{padding:14px;border:1px solid #e4e4d8;background:#f6f5ec;border-radius:13px;text-align:left;color:var(--ink)}.map-node:hover{border-color:#829980}.map-node b{display:block;font:600 15px Georgia,serif;margin:5px 0}.map-node small{color:#849087}.map-node span{font-size:22px}.map-node.locked{opacity:.5}.footer-note{text-align:center;color:#a0a79b;font-size:10px;padding:23px 0 5px}@media(max-width:1000px){.content{padding:23px}.grid{grid-template-columns:minmax(0,1.4fr) minmax(265px,.8fr)}.scene{height:380px}.resource-row{grid-template-columns:repeat(3,1fr)}.lower-grid{grid-template-columns:1fr}.craft-list{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.shell{grid-template-columns:1fr;padding-bottom:72px}.rail{position:fixed;z-index:10;bottom:0;left:0;right:0;height:66px;padding:6px 13px;flex-direction:row;justify-content:space-around;gap:0;box-shadow:0 -4px 20px #15231d20}.brand,.rail-bottom{display:none}.navbtn{height:48px;width:50px;font-size:19px}.navbtn.active:before{left:13px;top:-7px;width:24px;height:3px}.topbar{height:65px;padding:0 16px}.top-right{gap:9px}.weather{display:none}.content{padding:20px 15px}.welcome{align-items:flex-start}.welcome h1{font-size:26px}.day-pill{font-size:10px}.grid{grid-template-columns:1fr}.scene{height:325px}.sidecol{display:grid;grid-template-columns:1fr 1fr}.card{padding:14px}.quest-card{grid-column:span 2}.resource-row{grid-template-columns:repeat(3,1fr);gap:7px}.resource{padding:9px 8px;gap:7px}.resource-icon{width:31px;height:31px;font-size:16px}.resource-name{font-size:9px}.resource-amount{font-size:14px}.lower-grid{margin-top:17px}.craft-list{grid-template-columns:1fr}.recipe{padding:10px}.section-row{margin-top:21px}.scene-copy{left:20px;bottom:22px}.scene-copy h2{font-size:25px}.scene-controls{right:12px;bottom:13px}.scene-ctl{padding:7px 8px}.map-nodes{grid-template-columns:1fr 1fr}}@media(max-width:390px){.sidecol{grid-template-columns:1fr}.quest-card{grid-column:auto}.resource-row{grid-template-columns:repeat(2,1fr)}.wallet{padding:7px 9px;font-size:10px}.scene{height:295px}}

<body><div id="app"></div><div class="toast" id="toast"></div><div class="modal-back" id="mapModal"><div class="modal"><div class="modal-top"><h2>Explore the frontier</h2><button class="close" onclick="closeMap()">×</button></div><p style="color:#7e897f;font-size:12px;margin:8px 0 0">Choose a nearby place to gather, meet its inhabitants, and uncover a little more of the valley.</p><div class="map-nodes" id="mapNodes"></div></div></div>
<script>
const initial={day:1,coins:24,xp:0,level:1,energy:10,inventory:{wood:3,herb:2,stone:1,berry:2,fiber:0,potion:0,tool:0},quests:{herb:0,wood:0,craft:0},region:'Mosslight Glade',logs:[],unlocked:0};
let game;try{game={...initial,...JSON.parse(localStorage.getItem('wildwood-save')||'{}')};game.inventory={...initial.inventory,...game.inventory};game.quests={...initial.quests,...game.quests}}catch{game=structuredClone(initial)}
const resources={wood:{label:'Wood',icon:'🪵'},herb:{label:'Wild herbs',icon:'🌿'},stone:{label:'Stone',icon:'🪨'},berry:{label:'Berries',icon:'🫐'},fiber:{label:'Fiber',icon:'🧵'},potion:{label:'Tonics',icon:'🧪'},tool:{label:'Field tools',icon:'🪓'}};
const regions=[{name:'Mosslight Glade',icon:'🌳',desc:'Soft moss, old trees, and trails you almost recognize.',loot:['wood','herb','berry'],level:1},{name:'Whispering Brook',icon:'💧',desc:'A clear stream threading through fern-covered stones.',loot:['stone','herb','fiber'],level:1},{name:'Sunpetal Meadow',icon:'🌼',desc:'Golden grass sways beneath an open, patient sky.',loot:['herb','berry','fiber'],level:2},{name:'Foxglove Hollow',icon:'🍄',desc:'A shady hollow where curious things leave their tracks.',loot:['wood','berry','stone'],level:3}];
function save(){localStorage.setItem('wildwood-save',JSON.stringify(game));render()}
function addLog(text,icon='✦'){game.logs.unshift({text,icon,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});game.logs=game.logs.slice(0,12)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2100)}
function rewardXP(n){game.xp+=n;if(game.xp>=game.level*30){game.xp-=game.level*30;game.level++;game.energy=Math.min(10,game.energy+3);game.coins+=8;addLog(`You reached level ${game.level}! Your energy is restored.`,'⭐');toast(`Level up! You are now level ${game.level}`)}}
function spendEnergy(n=1){if(game.energy<n){toast('You are out of energy. Rest at camp to recover.');return false}game.energy-=n;return true}
function gather(type){if(!spendEnergy())return;const region=regions.find(r=>r.name===game.region)||regions[0];const thing=region.loot[Math.floor(Math.random()*region.loot.length)];const amount=1+(Math.random()<.32?1:0);game.inventory[thing]+=amount;if(thing==='herb')game.quests.herb+=amount;if(thing==='wood')game.quests.wood+=amount;rewardXP(5);addLog(`Gathered ${amount} ${resources[thing].label.toLowerCase()} in ${region.name}.`,resources[thing].icon);save();toast(`+${amount} ${resources[thing].label}`)}
function forage(){gather('forage')}
function rest(){const gain=Math.min(3,10-game.energy);if(gain<=0){toast('You feel well-rested already.');return}game.energy+=gain;game.day++;addLog(`You rested by the fire. A new day begins (+${gain} energy).`,'🌙');save();toast(`Rested: +${gain} energy`)}
function craft(item){const recipes={potion:{cost:{herb:2,berry:1},give:1,label:'a Trail tonic'},tool:{cost:{wood:2,stone:1},give:1,label:'a Field hatchet'}};const recipe=recipes[item];if(!Object.entries(recipe.cost).every(([k,n])=>game.inventory[k]>=n)){toast('Not enough materials for that recipe.');return}Object.entries(recipe.cost).forEach(([k,n])=>game.inventory[k]-=n);game.inventory[item]+=recipe.give;game.quests.craft++;rewardXP(8);addLog(`Crafted ${recipe.label} at the camp workbench.`,item==='potion'?'🧪':'🪓');save();toast(`Crafted ${recipe.label}`)}
function expedition(){if(!spendEnergy(2))return;const region=regions.find(r=>r.name===game.region)||regions[0];const item=region.loot[Math.floor(Math.random()*region.loot.length)];game.inventory[item]+=2;game.coins+=3;rewardXP(10);if(item==='herb')game.quests.herb+=2;if(item==='wood')game.quests.wood+=2;addLog(`A careful expedition returned with 2 ${resources[item].label.toLowerCase()} and 3 coins.`, '🧭');save();toast(`Expedition complete · +2 ${resources[item].label}`)}
function turnIn(){const q=game.quests;if(q.herb<3||q.wood<2){toast('Collect 3 herbs and 2 wood first.');return}q.herb-=3;q.wood-=2;game.coins+=18;rewardXP(15);addLog('Delivered supplies to the wayfarers. They paid 18 coins and shared a useful map note.','📜');if(game.level>=2)game.unlocked=Math.max(game.unlocked,2);save();toast('Quest complete · +18 coins · +15 XP')}
function visitRegion(name){game.region=name;addLog(`You set out for ${name}.`,'🧭');closeMap();save();toast(`Arrived at ${name}`)}
function openMap(){document.getElementById('mapModal').classList.add('open');document.getElementById('mapNodes').innerHTML=regions.map((r,i)=>`<button class="map-node ${game.level<r.level?'locked':''}" onclick="${game.level<r.level?'toast(\'Reach level '+r.level+' to explore this place.\')':`visitRegion('${r.name}')`}"><span>${r.icon}</span><b>${r.name}</b><small>${r.desc}</small><div style="font-size:10px;color:#82907e;margin-top:8px">${game.level<r.level?'🔒 Requires level '+r.level:'Gather · '+r.loot.map(x=>resources[x].label).join(', ')}</div></button>`).join('')}
function closeMap(){document.getElementById('mapModal').classList.remove('open')}
function questBar(key,goal){return Math.min(100,Math.floor(game.quests[key]/goal*100))}
function render(){const done=game.quests.herb>=3&&game.quests.wood>=2;document.getElementById('app').innerHTML=`<div class="shell"><aside class="rail"><div class="brand">✧</div><button class="navbtn active" title="Home" onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂</button><button class="navbtn" title="World map" onclick="openMap()">⌖</button><button class="navbtn" title="Crafting" onclick="document.getElementById('crafting').scrollIntoView({behavior:'smooth'})">⚒</button><button class="navbtn" title="Journal" onclick="document.getElementById('journal').scrollIntoView({behavior:'smooth'})">☷</button><div class="rail-bottom">⚙</div></aside><main class="main"><header class="topbar"><div class="location"><div class="location-icon">🌲</div><div><div class="eyebrow">The Green Marches</div><strong>${game.region}</strong></div></div><div class="top-right"><span class="weather">☀ &nbsp;Mild, clear skies</span><span class="wallet">◉ &nbsp;${game.coins} crowns</span><span class="avatar">🧝</span></div></header><div class="content"><section class="welcome"><div><div class="eyebrow">Day ${game.day} · Level ${game.level} wayfarer</div><h1>A life in the frontier</h1><p>Gather, make, and find your own rhythm in the wild.</p></div><span class="day-pill">✦ &nbsp;${game.xp} / ${game.level*30} XP</span></section><div class="grid"><section class="scene"><div class="scene-art"><div class="sun"></div><div class="cloud"></div><div class="cloud c2"></div><div class="mountain m1"></div><div class="mountain m2"></div><div class="ridge"></div><div class="ridge r2"></div><div class="meadow"></div><div class="path"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><span class="flower f1">✿</span><span class="flower f2">✿</span><span class="flower f3">✿</span><span class="deer">🦌</span></div><span class="region-badge">✦ &nbsp;Peaceful wilds</span><div class="scene-copy"><div class="eyebrow">Your current surroundings</div><h2>${game.region}</h2><p>A quiet place to begin again.</p></div><div class="scene-controls"><button class="scene-ctl" onclick="openMap()">⌖ &nbsp;World map</button><button class="scene-ctl" onclick="rest()">☾ &nbsp;Rest</button></div></section><aside class="sidecol"><div class="card quest-card"><div class="card-head"><span class="card-title">A helping hand</span><span class="subtle">Main quest</span></div><div class="quest"><div class="quest-top"><span class="quest-name">Supplies for the wayfarers</span><span class="quest-xp">+18 ◉ · +15 XP</span></div><div class="quest-desc">The traveling folk need a few things for the road.</div><div class="progress"><i style="width:${questBar('herb',3)}%"></i></div><div class="quest-count"><span>🌿 Wild herbs</span><span>${Math.min(3,game.quests.herb)} / 3</span></div><div class="progress" style="margin-top:8px"><i style="width:${questBar('wood',2)}%;background:#ae9666"></i></div><div class="quest-count"><span>🪵 Wood</span><span>${Math.min(2,game.quests.wood)} / 2</span></div></div><button class="action-btn ${done?'primary':''}" style="width:100%;padding:9px" onclick="turnIn()">${done?'✦ &nbsp;Deliver supplies':'Collect the requested supplies'}</button></div><div class="card"><div class="card-head"><span class="card-title">Your companion</span><span class="subtle">Always nearby</span></div><div class="companion"><div class="companion-icon">🦊</div><div class="companion-meta"><b>Bracken</b><span>Fox · curious scout</span></div><span class="mood">● Happy</span></div><div class="actions"><button class="action-btn" onclick="forage()"><span>🌾</span>Gather nearby</button><button class="action-btn primary" onclick="expedition()"><span>🧭</span>Explore (2 energy)</button></div><div style="display:flex;justify-content:space-between;margin-top:12px;font-size:10px;color:#899287"><span>☀ Energy</span><span>${game.energy} / 10</span></div><div class="progress" style="margin-top:6px"><i style="width:${game.energy*10}%;background:#d1aa68"></i></div></div></aside></div><div class="section-row"><div><h2>In your pack</h2><p>Everything you've found along the way.</p></div><button class="text-btn" onclick="rest()">☾ &nbsp;Rest & refresh energy</button></div><div class="resource-row">${Object.keys(resources).map(k=>`<div class="resource"><div class="resource-icon">${resources[k].icon}</div><div class="resource-info"><div class="resource-name">${resources[k].label}</div><div class="resource-amount">${game.inventory[k]||0}</div></div></div>`).join('')}</div><div class="lower-grid"><section class="card" id="crafting"><div class="card-head"><span class="card-title">The workbench</span><span class="subtle">Simple things, made well</span></div><div class="craft-list"><div class="recipe"><div class="recipe-icon">🧪</div><div class="recipe-info"><b>Trail tonic</b><span>2 herbs + 1 berry</span></div><button class="make-btn" ${game.inventory.herb<2||game.inventory.berry<1?'disabled':''} onclick="craft('potion')">Make</button></div><div class="recipe"><div class="recipe-icon">🪓</div><div class="recipe-info"><b>Field hatchet</b><span>2 wood + 1 stone</span></div><button class="make-btn" ${game.inventory.wood<2||game.inventory.stone<1?'disabled':''} onclick="craft('tool')">Make</button></div><div class="recipe"><div class="recipe-icon">🍲</div><div class="recipe-info"><b>Berry supper</b><span>2 berries · restore 2 energy</span></div><button class="make-btn" ${game.inventory.berry<2?'disabled':''} onclick="cook()">Cook</button></div></div></section><section class="card" id="journal"><div class="card-head"><span class="card-title">Wayfarer's journal</span><span class="subtle">Recent moments</span></div><div class="log">${(game.logs.length?game.logs:[{text:'A new day, and a whole valley to discover.',icon:'🌱',time:'Today'},{text:'Bracken found a trail leading into the glade.',icon:'🐾',time:'Today'}]).map(l=>`<div class="log-line"><span>${l.icon}</span><span>${l.text}</span><time>${l.time}</time></div>`).join('')}</div></section></div><div class="footer-note">WILDWOOD &nbsp;·&nbsp; Find your pace, find your place.</div></div></main></div>`}
function cook(){if(game.inventory.berry<2){toast('You need two berries to cook.');return}game.inventory.berry-=2;game.energy=Math.min(10,game.energy+2);rewardXP(3);addLog('Cooked a warm berry supper. Restored 2 energy.','🍲');save();toast('A good meal · +2 energy')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMap()});document.getElementById('mapModal').addEventListener('click',e=>{if(e.target.id==='mapModal')closeMap()});render();
</script></body></html>
